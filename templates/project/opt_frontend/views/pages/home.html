{{define "title"}}Home — gostack{{end}}
{{define "content"}}
<section class="hero">
  <h1>{{.Message}}</h1>
  <p>A fullstack Go framework inspired by NestJS.</p>

  <div class="demo">

    <span id="ping-result"></span>
  </div>
</section>
{{end}}
